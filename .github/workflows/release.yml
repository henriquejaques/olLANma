name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GOVULNCHECK_VERSION: v1.1.4

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'

      - name: Run tests before release
        run: go test -race ./...

      - name: Run govulncheck before release
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          mkdir -p dist

          # Linux amd64
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.Version=${{ steps.version.outputs.VERSION }}" \
            -o dist/olLANma-linux-amd64 .

          # Linux arm64
          GOOS=linux GOARCH=arm64 go build \
            -ldflags "-s -w -X main.Version=${{ steps.version.outputs.VERSION }}" \
            -o dist/olLANma-linux-arm64 .

          # Linux armv7
          GOOS=linux GOARCH=arm GOARM=7 go build \
            -ldflags "-s -w -X main.Version=${{ steps.version.outputs.VERSION }}" \
            -o dist/olLANma-linux-armv7 .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum olLANma-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          generate_release_notes: true
          files: |
            dist/olLANma-linux-amd64
            dist/olLANma-linux-arm64
            dist/olLANma-linux-armv7
            dist/checksums.txt
